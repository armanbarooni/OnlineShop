<!doctype html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>قالب فرشگاهی آرینو</title>
    <meta name="description"
        content="قالب فرشگاهی آرینو، بهترین قالب برای فروشگاه‌های اینترنتی با طراحی مدرن و واکنش‌گرا.">
    <meta name="keywords" content="قالب فروشگاهی, قالب آرینو, فروشگاه اینترنتی, طراحی واکنش‌گرا">
    <meta name="robots" content="index, follow">
    <meta name="author" content="آرینو">
    <meta name="copyright" content="تمامی حقوق متعلق به آرینو است.">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon_io/favicon-16x16.png">
    <link rel="canonical" href="https://example.com/your-page-url">
    <link rel="stylesheet" href="assets/js/plugin/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="preload" href="assets/fonts/payda/PeydaWebFaNum-Medium.woff2" as="font" type="font/woff2" crossorigin>
    <!-- Persian Date Picker -->
    <link rel="stylesheet" href="https://unpkg.com/persian-datepicker@1.2.0/dist/css/persian-datepicker.min.css">
</head>

<body
    class="bg-light dark:bg-background-dark text-text-primary-light dark:text-text-primary-dark transition-colors duration-200">

    <div class="flex h-screen overflow-hidden max-w-[1920px] mx-auto">
        <div data-layout-partial="user-panel-sidebar" data-layout-script="assets/js/components/user-panel-nav.js"></div>

        <!-- main content -->
        <div class="flex flex-col flex-1 overflow-hidden">
            <!-- header -->
            <header
                class="flex items-center justify-between px-6 py-4 bg-white dark:bg-card-dark border-b border-gray-200 dark:border-gray-700">
                <div class="flex items-center">
                    <!-- Button menu for mobile -->
                    <button onclick="toggleOffcanvas('offcanvas-responsive-menu-right')"
                        class="lg:hidden text-gray-500 dark:text-gray-400 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                            stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>

                    <!-- search -->
                    <form id="searchForm" class="relative max-lg:hidden ms-4 lg:ms-0 lg:w-96">
                        <span class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-400" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z"
                                    clip-rule="evenodd" />
                            </svg>
                        </span>
                        <input type="text" name="search" id="searchInput"
                            class="w-full ps-10 pe-4 py-2 border rounded-xl focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white placeholder-gray-500"
                            placeholder="جستجو در پنل کاربری...">
                    </form>
                </div>

                <!-- top menu -->
                <div class="flex items-center space-x-4 space-x-reverse">
                    <!-- Change mode button -->
                    <button id="dark-mode-toggle"
                        class="text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300 focus:outline-none">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 hidden dark:block" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
                        </svg>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 dark:hidden" fill="none"
                            viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
                        </svg>
                    </button>

<!-- user drop down -->
                    <div class="relative ms-3" id="user-dropdown">
                        <!-- Dropdown Button -->
                        <button onclick="toggleUserDropdown()" id="user-dropdown-button"
                            class="flex items-center focus:outline-none">
                            <div class="relative">
                                <img class="h-8 w-8 max-sm:hidden rounded-full border-2 border-white dark:border-gray-800 shadow"
                                    src="assets/images/user/user.png" alt="پروفایل کاربر">
                                <span
                                    class="absolute bottom-0 start-0 w-2 h-2 rounded-full bg-green-500 dark:bg-green-400 border-2 border-white dark:border-gray-800"></span>
                            </div>
                            <span class="ms-2 text-sm font-medium text-gray-900 dark:text-white"
                                data-user-name="true">کاربر مهمان</span>
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                                stroke="currentColor" id="user-dropdown-icon" class="size-4 ms-2 transition-transform">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5">
                                </path>
                            </svg>
                        </button>

                        <!-- Dropdown Menu -->
                        <div id="user-dropdown-menu"
                            class="absolute end-0 mt-2 w-48 bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-lg z-10 shadow-lg hidden">
                            <!-- Profile Link -->
                            <a href="user-panel-profile.html"
                                class="flex items-center px-4 py-2 text-sm text-gray-700 space-x-1 rounded-lg dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                <svg xmlns="http://www.w3.org/2000/svg" class="size-6" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                                </svg>
                                <span>پروفایل</span>
                            </a>

                            <!-- Logout Link -->
                            <a href="#" id="logoutButton"
                                class="flex items-center px-4 py-2 text-sm text-gray-700 space-x-1 rounded-lg dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-700">
                                <svg xmlns="http://www.w3.org/2000/svg" class="size-6" fill="none" viewBox="0 0 24 24"
                                    stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round"
                                        d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15M12 9l-3 3m0 0 3 3m-3-3h12.75" />
                                </svg>
                                <span>خروج</span>
                            </a>
                        </div>
                    </div>

                </div>
            </header>

            <!-- page content -->
            <main class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-background-dark">
                <!-- Page header -->
                <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between">
                    <div>
                        <h2 class="text-2xl font-bold text-dark dark:text-light">پروفایل کاربری</h2>
                        <p class="text-gray-600 dark:text-gray-400">اطلاعات شخصی و تنظیمات حساب کاربری</p>
                    </div>
                    <div class="mt-4 md:mt-0 flex space-x-3 space-x-reverse">

                    </div>
                </div>

                <!-- Profile content -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- User information -->
                    <div class="lg:col-span-2 space-y-6">
                        <!-- Personal Information Card -->
                        <div
                            class="border rounded-xl overflow-hidden bg-white dark:bg-card-dark shadow-soft dark:shadow-soft-dark">
                            <div class="p-5 border-b border-gray-200 dark:border-gray-700">
                                <h3 class="text-lg font-bold flex items-center">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="h-5 w-5 me-2 text-primary dark:text-primary-dark" viewBox="0 0 20 20"
                                        fill="currentColor">
                                        <path fill-rule="evenodd"
                                            d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                                            clip-rule="evenodd" />
                                    </svg>
                                    اطلاعات شخصی
                                </h3>
                            </div>
                            <div class="p-5">
                                <div class="flex flex-col md:flex-row gap-6">
                                    <!-- Profile picture -->
                                    <div class="flex flex-col items-center">
                                        <div class="relative">
                                            <img id="profileImage"
                                                class="h-24 w-24 rounded-full border-4 border-white dark:border-gray-800 shadow-lg"
                                                src="assets/images/user/user.jpg" alt="پروفایل کاربر">
                                            <button type="button"
                                                onclick="document.getElementById('profileImageInput').click()"
                                                class="absolute bottom-0 start-0 bg-primary dark:bg-primary-dark text-white p-2 rounded-full shadow-sm hover:bg-primary/90 dark:hover:bg-primary/80 transition-colors">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                                                    viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="2"
                                                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                                </svg>
                                            </button>
                                            <input type="file" id="profileImageInput" class="hidden" accept="image/*">
                                        </div>
                                        <button type="button" onclick="document.getElementById('profileImageInput').click()"
                                            class="mt-3 text-sm text-primary dark:text-primary-dark hover:underline">تغییر
                                            تصویر</button>
                                    </div>

                                    <!-- Information form -->
                                    <form id="profileForm" class="flex-1 space-y-4">
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label for="firstName"
                                                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">نام</label>
                                                <input type="text" id="firstName" name="firstName" disabled
                                                    class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-70 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700">
                                            </div>
                                            <div>
                                                <label for="lastName"
                                                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">نام
                                                    خانوادگی</label>
                                                <input type="text" id="lastName" name="lastName" disabled
                                                    class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-70 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700">
                                            </div>
                                        </div>
                                        <div>
                                            <label for="email"
                                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">پست
                                                الکترونیک</label>
                                            <input type="email" id="email" name="email" disabled
                                                class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-70 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700">
                                        </div>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label for="phone"
                                                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">شماره
                                                    موبایل</label>
                                                <input type="tel" id="phone" name="phone" disabled
                                                    class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-70 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700">
                                            </div>
                                            <div>
                                                <label for="birthDate"
                                                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">تاریخ
                                                    تولد</label>
                                                <input type="text" id="birthDate" name="birthDate"
                                                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                            </div>
                                        </div>
                                        <div>
                                            <label for="nationalCode"
                                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">کد
                                                ملی</label>
                                            <input type="text" id="nationalCode" name="nationalCode"
                                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                        </div>
                                        <div class="pt-4">
                                            <button type="submit"
                                                class="px-6 py-2 bg-primary hover:bg-primary/90 dark:bg-primary-dark dark:hover:bg-primary/80 text-white rounded-lg text-sm font-medium transition-colors">
                                                ذخیره تغییرات
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Additional information -->
                    <div class="space-y-6">
                        <!-- Account Status Card -->

                    </div>
                </div>
            </main>
        </div>
    </div>
    <!-- /end page divider -->

    <!-- start canvas message -->
    <div data-layout-partial="user-panel-mobile-menu"></div>
<!-- Core JS -->
    <script src="assets/js/components/layout-loader.js"></script>

    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth-service.js"></script>
    <script src="assets/js/services/user-profile-service.js"></script>
    <script src="assets/js/components/header-component.js"></script>
    <!-- jQuery (required for persian-datepicker) -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Persian Date Picker -->
    <script src="https://unpkg.com/persian-date@1.1.0/dist/persian-date.min.js"></script>
    <script src="https://unpkg.com/persian-datepicker@1.2.0/dist/js/persian-datepicker.min.js"></script>
    <script src="assets/js/pages/user-panel-profile.js"></script>
    <script>
        // Header component will be initialized automatically via DOMContentLoaded event in header-component.js
        // No need to call init() here to avoid duplicate initialization
    </script>
</body>

</html>
