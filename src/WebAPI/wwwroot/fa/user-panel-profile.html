    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon_io/favicon-32x32.png">

<body
    class="bg-light dark:bg-background-dark text-text-primary-light dark:text-text-primary-dark transition-colors duration-200">

    <div class="flex h-screen overflow-hidden max-w-[1920px] mx-auto">
        <div data-layout-partial="user-panel-sidebar" data-layout-script="assets/js/components/user-panel-nav.js"></div>

        <!-- main content -->
        <div class="flex flex-col flex-1 overflow-hidden">            <div data-layout-partial="user-panel-header"></div>

            <!-- page content -->
            <main class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-background-dark">
                <!-- Page header -->
                <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between">
                    <div>
                        <h2 class="text-2xl font-bold text-dark dark:text-light">پروفایل کاربری</h2>
                        <p class="text-gray-600 dark:text-gray-400">اطلاعات شخصی و تنظیمات حساب کاربری</p>
                    </div>
                    <div class="mt-4 md:mt-0 flex space-x-3 space-x-reverse">

                    </div>
                </div>

                <!-- Profile content -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <!-- User information -->
                    <div class="lg:col-span-2 space-y-6">
                        <!-- Personal Information Card -->
                        <div
                            class="border rounded-xl overflow-hidden bg-white dark:bg-card-dark shadow-soft dark:shadow-soft-dark">
                            <div class="p-5 border-b border-gray-200 dark:border-gray-700">
                                <h3 class="text-lg font-bold flex items-center">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="h-5 w-5 me-2 text-primary dark:text-primary-dark" viewBox="0 0 20 20"
                                        fill="currentColor">
                                        <path fill-rule="evenodd"
                                            d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z"
                                            clip-rule="evenodd" />
                                    </svg>
                                    اطلاعات شخصی
                                </h3>
                            </div>
                            <div class="p-5">
                                <div class="flex flex-col md:flex-row gap-6">
                                    <!-- Profile picture -->
                                    <div class="flex flex-col items-center">
                                        <div class="relative">
                                            <img id="profileImage"
                                                class="h-24 w-24 rounded-full border-4 border-white dark:border-gray-800 shadow-lg"
                                                src="assets/images/user/user.jpg" alt="پروفایل کاربر">
                                            <button type="button"
                                                onclick="document.getElementById('profileImageInput').click()"
                                                class="absolute bottom-0 start-0 bg-primary dark:bg-primary-dark text-white p-2 rounded-full shadow-sm hover:bg-primary/90 dark:hover:bg-primary/80 transition-colors">
                                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none"
                                                    viewBox="0 0 24 24" stroke="currentColor">
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="2"
                                                        d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                                    <path stroke-linecap="round" stroke-linejoin="round"
                                                        stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                                </svg>
                                            </button>
                                            <input type="file" id="profileImageInput" class="hidden" accept="image/*">
                                        </div>
                                        <button type="button" onclick="document.getElementById('profileImageInput').click()"
                                            class="mt-3 text-sm text-primary dark:text-primary-dark hover:underline">تغییر
                                            تصویر</button>
                                    </div>

                                    <!-- Information form -->
                                    <form id="profileForm" class="flex-1 space-y-4">
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label for="firstName"
                                                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">نام</label>
                                                <input type="text" id="firstName" name="firstName" disabled
                                                    class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-70 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700">
                                            </div>
                                            <div>
                                                <label for="lastName"
                                                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">نام
                                                    خانوادگی</label>
                                                <input type="text" id="lastName" name="lastName" disabled
                                                    class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-70 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700">
                                            </div>
                                        </div>
                                        <div>
                                            <label for="email"
                                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">پست
                                                الکترونیک</label>
                                            <input type="email" id="email" name="email" disabled
                                                class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-70 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700">
                                        </div>
                                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div>
                                                <label for="phone"
                                                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">شماره
                                                    موبایل</label>
                                                <input type="tel" id="phone" name="phone" disabled
                                                    class="w-full px-4 py-2 border rounded-lg bg-gray-100 text-gray-500 cursor-not-allowed opacity-70 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700">
                                            </div>
                                            <div>
                                                <label for="birthDate"
                                                    class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">تاریخ
                                                    تولد</label>
                                                <input type="text" id="birthDate" name="birthDate"
                                                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                            </div>
                                        </div>
                                        <div>
                                            <label for="nationalCode"
                                                class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">کد
                                                ملی</label>
                                            <input type="text" id="nationalCode" name="nationalCode"
                                                class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white">
                                        </div>
                                        <div class="pt-4">
                                            <button type="submit"
                                                class="px-6 py-2 bg-primary hover:bg-primary/90 dark:bg-primary-dark dark:hover:bg-primary/80 text-white rounded-lg text-sm font-medium transition-colors">
                                                ذخیره تغییرات
                                            </button>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>

                    </div>

                    <!-- Additional information -->
                    <div class="space-y-6">
                        <!-- Account Status Card -->

                    </div>
                </div>
            </main>
        </div>
    </div>
