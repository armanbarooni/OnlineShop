    <script>
        // Utility Functions
        function formatDate(dateString) {
            if (!dateString) return '';
            return new Date(dateString).toLocaleDateString('fa-IR');
        }

        function formatPrice(amount) {
            if (amount === undefined || amount === null) return '0 ریال';
            return new Intl.NumberFormat('fa-IR').format(amount) + ' ریال';
        }

        // Status Helpers
        const statusConfig = {
            0: { text: 'در انتظار پرداخت', class: 'bg-yellow-100 text-yellow-800' },
            1: { text: 'در حال پردازش', class: 'bg-blue-100 text-blue-800' },
            2: { text: 'ارسال شده', class: 'bg-indigo-100 text-indigo-800' },
            3: { text: 'تحویل شده', class: 'bg-green-100 text-green-800' },
            4: { text: 'لغو شده', class: 'bg-red-100 text-red-800' },
            5: { text: 'مرجوع شده', class: 'bg-gray-100 text-gray-800' }
        };

        function getStatusInfo(status) {
            return statusConfig[status] || { text: 'نامشخص', class: 'bg-gray-100 text-gray-800' };
        }

        // Dashboard Logic
        const Dashboard = {
            init: async function () {
                if (window.authService && !window.authService.isAuthenticated()) {
                    window.location.href = 'login.html';
                    return;
                }

                if (window.HeaderComponent) window.HeaderComponent.init();
                this.initLogout();

                await this.loadData();
            },

            initLogout: function () {
                const logoutBtns = document.querySelectorAll('#logoutButton');
                logoutBtns.forEach(btn => {
                    btn.onclick = (e) => {
                        e.preventDefault();
                        if (window.authService) window.authService.logout();
                    };
                });

                // Also target the logout button in sidebar/responsive menu if it doesn't have ID
                document.querySelectorAll('button').forEach(btn => {
                    if (btn.textContent.includes('خروج از حساب')) {
                        btn.onclick = (e) => {
                            e.preventDefault();
                            if (window.authService) window.authService.logout();
                        };
                    }
                });
            },

            loadData: async function () {
                try {
                    // Load Wishlist first so profile/order errors cannot block it
                    const initialWishlistData = await window.wishlistService.getWishlistCount();
                    if (initialWishlistData.success) {
                        this.setCountWithUnit('wishlistCount', initialWishlistData.count, 'محصول');
                    }

                    // Load Profile
                    const profile = await window.userProfileService.getProfile();
                    if (profile.success) {
                        const fullName = `${profile.data.firstName || ''} ${profile.data.lastName || 'کاربر'}`;
                        const nameEl = document.getElementById('welcomeMessage');
                        if (nameEl) nameEl.textContent = `سلام ${fullName}`;

                        // Update all user name placeholders in sidebars/headers
                        document.querySelectorAll('[data-user-name="true"]').forEach(el => {
                            el.textContent = fullName;
                        });
                        // Fallback for elements without data attribute but known content
                        document.querySelectorAll('.text-sm.font-medium.text-gray-900.dark\\:text-white').forEach(el => {
                            if (el.textContent.includes('مریم محمدی')) el.textContent = fullName;
                        });
                        document.querySelectorAll('.text-sm.font-medium.text-dark.dark\\:text-light').forEach(el => {
                            if (el.textContent.includes('مریم محمدی')) el.textContent = fullName;
                        });
                    }

                    // Load Orders
                    const ordersData = await window.orderService.getMyOrders();
                    if (ordersData.success) {
                        // Active Orders (Pending or Processing)
                        const activeCount = ordersData.data.filter(o => o.status === 0 || o.status === 1).length;
                        document.getElementById('activeOrdersCount').textContent = activeCount;

                        // Recent Orders
                        this.renderRecentOrders(ordersData.data.slice(0, 5));
                    }

                    // Load Wishlist
                    const wishlistData = await window.wishlistService.getWishlistCount();
                    if (wishlistData.success) {
                        this.setCountWithUnit('wishlistCount', wishlistData.count, 'محصول');
                    }

                } catch (e) {
                    console.error('Failed to load dashboard data', e);
                }
            },

            setCountWithUnit: function (elementId, count, unit) {
                const el = document.getElementById(elementId);
                if (!el) return;

                const safeCount = Number.isFinite(Number(count)) ? Number(count) : 0;
                el.innerHTML = `${safeCount} <span class="text-sm">${unit}</span>`;
            },

            renderRecentOrders: function (orders) {
                const tbody = document.getElementById('recentOrdersTableBody');
                if (!tbody) return;

                if (!orders.length) {
                    tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-4 text-center text-gray-500">سفارشی یافت نشد</td></tr>';
                    return;
                }

                tbody.innerHTML = orders.map(order => {
                    const statusInfo = getStatusInfo(order.status);
                    return `
                        <tr class="hover:bg-gray-50 dark:hover:bg-gray-700/50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-dark dark:text-light">#${order.id}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${formatDate(order.orderDate)}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 dark:text-gray-400">${formatPrice(order.totalAmount)}</td>
                            <td class="px-6 py-4 whitespace-nowrap">
                                <span class="px-3 py-1 inline-flex text-xs leading-5 rounded-full ${statusInfo.class}">
                                    ${statusInfo.text}
                    </span>
                            </td>
                        </tr>
                    `;
                }).join('');
            }
        };

        // Event Listeners
        document.addEventListener('DOMContentLoaded', () => {
            Dashboard.init();
        });

        // UI Helpers (Global)
        window.closeOffcanvas = function () {
            document.querySelectorAll('.offcanvas').forEach(el => {
                el.classList.remove('active');
                el.classList.add('invisible', 'opacity-0', '-translate-x-full');
            });
            const overlay = document.querySelector('.overlay');
            if (overlay) overlay.classList.add('hidden');
        }

    </script>
    <script>
        // Setup dropdown - ensure it works after all scripts are loaded
        document.addEventListener('DOMContentLoaded', () => {
            const setupUserDropdown = () => {
                const btn = document.getElementById('user-dropdown-button');
                const menu = document.getElementById('user-dropdown-menu');
                const icon = document.getElementById('user-dropdown-icon');
                
                if (!btn || !menu) return;
                
                // Remove any inline display style
                menu.style.display = '';
                
                // Remove any existing onclick
                btn.onclick = null;
                
                // Setup click handler
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    menu.classList.toggle('hidden');
                    menu.style.display = '';
                    if (icon) icon.classList.toggle('rotate-180');
                });
                
                // Close on outside click
                document.addEventListener('click', function(e) {
                    if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
                        menu.classList.add('hidden');
                        menu.style.display = '';
                        if (icon) icon.classList.remove('rotate-180');
                    }
                });
            };
            
            // Setup after a small delay to ensure all scripts are loaded
            setTimeout(setupUserDropdown, 100);
        });
    </script>
