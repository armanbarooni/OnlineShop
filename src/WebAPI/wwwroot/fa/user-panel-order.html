    <script>
        // Init Header
        document.addEventListener('DOMContentLoaded', () => {
            if (window.headerComponent) {
                window.headerComponent.init();
            }
            
            // Setup dropdown - ensure it works after all scripts are loaded
            const setupUserDropdown = () => {
                const btn = document.getElementById('user-dropdown-button');
                const menu = document.getElementById('user-dropdown-menu');
                const icon = document.getElementById('user-dropdown-icon');
                
                if (!btn || !menu) return;
                
                // Remove any inline display style
                menu.style.display = '';
                
                // Remove any existing onclick
                btn.onclick = null;
                
                // Setup click handler
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    e.preventDefault();
                    menu.classList.toggle('hidden');
                    menu.style.display = '';
                    if (icon) icon.classList.toggle('rotate-180');
                });
                
                // Close on outside click
                document.addEventListener('click', function(e) {
                    if (btn && menu && !btn.contains(e.target) && !menu.contains(e.target)) {
                        menu.classList.add('hidden');
                        menu.style.display = '';
                        if (icon) icon.classList.remove('rotate-180');
                    }
                });
            };
            
            // Setup after a small delay to ensure all scripts are loaded
            setTimeout(setupUserDropdown, 100);
        });
    </script>
