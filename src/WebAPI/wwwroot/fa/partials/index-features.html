<style>
  .category-showcase-shell {
    max-width: 58rem;
    margin-inline: auto;
    padding-inline: clamp(1rem, 3vw, 1.5rem);
  }

  .category-section-divider {
    width: min(72%, 28rem);
    height: 1px;
    margin: 0 auto 1rem;
    border: 0;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(100, 116, 139, 0.45) 18%,
      rgba(100, 116, 139, 0.45) 82%,
      transparent
    );
  }

  .dark .category-section-divider {
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.22) 18%,
      rgba(255, 255, 255, 0.22) 82%,
      transparent
    );
  }

  .category-showcase-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .category-showcase-card {
    position: relative;
    display: block;
    height: 100%;
    overflow: hidden;
    border-radius: 10px;
    -webkit-clip-path: none;
    clip-path: none;
    border: 0;
    background: #ffffff;
    box-shadow: 0 10px 24px rgba(15, 23, 42, 0.1);
    transition: transform 300ms ease;
    transform: translateZ(0);
  }

  .category-showcase-card > img {
    border-radius: 10px;
    object-fit: cover;
  }

  @media (max-width: 767.98px) {
    .category-showcase-shell {
      padding-inline: 0.75rem;
    }

    .category-showcase-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
    }

    .category-showcase-card {
      min-height: 0 !important;
      border-radius: 10px;
      -webkit-clip-path: none;
      clip-path: none;
      box-shadow: 0 5px 14px rgba(15, 23, 42, 0.08);
    }
  }

  @media (max-width: 479.98px) {
    .category-showcase-grid {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
  }
</style>
