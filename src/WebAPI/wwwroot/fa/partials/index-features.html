<style>
  .category-showcase-shell {
    max-width: 58rem;
    margin-inline: auto;
    padding-inline: clamp(1rem, 3vw, 1.5rem);
  }

  .home-section-kicker {
    position: relative;
    overflow: hidden;
    border-radius: 1.45rem;
    background: #172334;
    padding: clamp(1.05rem, 3vw, 1.65rem);
    box-shadow: 0 18px 40px rgba(15, 23, 42, 0.2);
  }

  .home-section-kicker::after {
    content: "";
    position: absolute;
    inset-block-start: 1.2rem;
    inset-inline-end: clamp(1rem, 4vw, 2.5rem);
    width: 5.2rem;
    height: 4.1rem;
    opacity: 0.34;
    background-image: radial-gradient(currentColor 1.7px, transparent 1.7px);
    background-size: 13px 13px;
    color: #ffffff;
  }

  .home-section-kicker h2 {
    position: relative;
    z-index: 1;
    margin: 0;
    text-align: center;
    font-size: clamp(1.35rem, 3vw, 2rem);
    font-weight: 900;
    line-height: 1.7;
    color: #ffffff;
  }

  .home-section-kicker h2 span {
    color: #ff6b21;
  }

  .category-showcase-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 12px;
  }

  .category-showcase-card {
    position: relative;
    display: block;
    height: 100%;
    overflow: hidden;
    border-radius: 1.55rem;
    -webkit-clip-path: inset(0 round 1.55rem);
    clip-path: inset(0 round 1.55rem);
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgb(24 24 27);
    box-shadow: 0 18px 34px rgba(0, 0, 0, 0.22);
    transition: transform 300ms ease;
    transform: translateZ(0);
  }

  .category-showcase-card > img {
    border-radius: inherit;
    object-fit: fill;
  }

  .category-showcase-divider {
    max-width: 58rem;
    margin: clamp(1.1rem, 3vw, 1.8rem) auto 0;
    padding-inline: clamp(1rem, 3vw, 1.5rem);
  }

  .category-showcase-divider span {
    display: block;
    height: 1px;
    border-radius: 999px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 107, 33, 0.65),
      rgba(23, 35, 52, 0.42),
      rgba(255, 107, 33, 0.65),
      transparent
    );
    box-shadow: 0 10px 28px rgba(255, 107, 33, 0.18);
  }

  @media (max-width: 767.98px) {
    .category-showcase-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
  }

  @media (max-width: 479.98px) {
    .category-showcase-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
  }
</style>
