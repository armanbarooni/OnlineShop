<!-- ================= start header ================= -->
    <style>
      .desktop-mega-menu {
        display: none;
      }

      @media (max-width: 1023px) {
        #topHeader {
          width: calc(100% - 1.5rem);
          margin-inline: auto;
          margin-top: 0.75rem;
          padding: 0.625rem 0 0.75rem;
          top: 0.75rem;
          border: 1px solid rgba(148, 163, 184, 0.2);
          border-radius: 1.25rem;
          background: #f8fafc;
          box-shadow:
            0 12px 28px rgba(15, 23, 42, 0.1),
            0 2px 7px rgba(15, 23, 42, 0.06),
            inset 0 1px 0 rgba(255, 255, 255, 0.9);
        }

        .dark #topHeader {
          border-color: rgba(255, 255, 255, 0.1);
          background: #111827;
          box-shadow:
            0 14px 30px rgba(0, 0, 0, 0.32),
            0 2px 8px rgba(0, 0, 0, 0.2),
            inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        #topHeader .site-header-row {
          position: relative;
        }

        #topHeader .site-header-logo {
          position: absolute;
          inset-inline-start: 50%;
          top: 0;
          width: auto;
          transform: translateX(-50%);
        }

        [dir="rtl"] #topHeader .site-header-logo {
          transform: translateX(50%);
        }

        #topHeader .site-header-logo img {
          height: 2.5rem !important;
          width: auto;
          max-width: 9rem;
          object-fit: contain;
        }

        #topHeader .site-header-actions {
          position: absolute;
          inset-inline-end: 0;
          top: 0;
          width: auto;
          min-height: 2.5rem;
        }

        #topHeader .mobile-cart,
        #topHeader .mobile-auth {
          display: none;
        }

        #topHeader .site-header-actions > div,
        #topHeader .site-header-tools {
          justify-content: flex-end;
          margin: 0;
        }

        #topHeader .site-header-search {
          margin-top: 0;
        }

        #topHeader .site-header-search input {
          padding-top: 0.5rem !important;
          padding-bottom: 0.5rem !important;
        }

        #topHeader .site-header-search button {
          padding: 0.375rem;
        }
      }

      @media (min-width: 1280px) {
        .desktop-mega-menu {
          display: block;
        }
      }
    </style>
    <header
      id="topHeader"
      class="py-2 md:py-3 dark:shadow-none dark:bg-gray-900 sticky top-0 start-0 end-0 z-20 shadow-sm bg-white border-b border-gray-100 dark:border-white/20"
    >
      <div class="container">
        <!-- row top header -->

        <div class="site-header-row grid place-items-center gap-3 grid-cols-12">
          <!-- mobile menu -->
          <div class="lg:hidden order-1 col-span-2 w-full">
            <button
              type="button"
              onclick="toggleOffcanvas('offcanvas-right')"
              class="flex size-10 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-800 shadow-sm transition hover:text-primary dark:border-white/20 dark:bg-gray-900 dark:text-white"
              aria-label="باز کردن منو"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                class="size-6"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                />
              </svg>
            </button>
          </div>
          <!-- logo -->
          <div class="site-header-logo lg:col-span-2 lg:order-1 order-2 col-span-4 w-full">
            <a href="index.html">
              <div class="lg:text-start text-center">
                <img
                  class="h-12 dark:hidden"
                  style="height: 3.25rem;"
                  src="assets/images/logo.webp"
                  loading="eager"
                  fetchpriority="high"
                  decoding="async"
                  alt=""
                />
                <img
                  class="hidden h-12 dark:block"
                  style="height: 3.25rem;"
                  src="assets/images/logo_white.png"
                  loading="eager"
                  fetchpriority="high"
                  decoding="async"
                  alt=""
                />
              </div>
            </a>
          </div>
          <!-- search and filter -->
          <div
            class="site-header-search lg:col-span-6 lg:order-2 order-4 col-span-12 w-full"
          >
            <div class="mx-auto flex w-full items-center justify-between" style="max-width: 36rem;">
              <!-- search -->
              <div class="flex w-full items-center">
                <!--Search component-->
                <div class="relative flex items-center w-full">
                  <input
                    type="search"
                    id="searchInput"
                    class="w-full appearance-none dark:text-white rounded-2xl border border-gray-300 dark:border-white/20 pe-4 dark:placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-primary-500 focus:border-transparent bg-white dark:bg-gray-900 shadow-sm"
                    style="padding-top: .625rem; padding-bottom: .625rem; padding-inline-start: 3.5rem;"
                    placeholder="جستجوی محصولات ...."
                  />
                  <button
                    type="button"
                    class="bg-primary p-2 text-white rounded-2xl absolute start-1 hover:opacity-90 transition-opacity"
                    aria-label="Search"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                      class="size-6 dark:text-white"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
                      />
                    </svg>
                  </button>
                  <!--Search results-->
                  <div
                    id="searchResults"
                    class="bg-white absolute top-13 border border-gray-400 z-10 end-0 start-0 dark:bg-gray-700 rounded-xl shadow-lg overflow-hidden hidden"
                  >
                    <!-- The results content will be filled by JavaScript -->
                  </div>
                </div>
              </div>

            </div>
          </div>
          <!-- login and basket and call and darkmode -->
          <div class="site-header-actions lg:col-span-4 col-span-6 order-3 lg:order-3 w-full">
            <div class="flex items-baseline justify-end">
              <!-- basket and call and darkmode -->
              <div class="site-header-tools flex items-baseline md:me-5 me-2">

                <div

                >
                  <span
                    data-cart-count

                    style="min-width: 24px; height: 20px; line-height: 20px; padding: 0 7px; background-color: #f97316; color: #ffffff; top: -14px; inset-inline-end: -18px;"
                    aria-label="تعداد محصولات سبد خرید"
                  >0</span>
                                   <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="size-5 md:size-7 dark:text-white"

                    />
                  </svg>
                </div>
                <!-- dark mode -->
                <div class="md:ms-5 ms-2">
                  <button id="dark-mode-toggle" aria-label="Toggle dark mode">
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"
                      stroke="currentColor"
                      class="lg:size-8 size-5 md:size-6 dark:block hidden dark:text-white"
                      aria-hidden="true"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"
                      />

                    <svg

                      fill="none"

                      stroke="currentColor"

                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"
                      />
                    </svg>
                  </button>
                </div>
              </div>
              <div
                class="lg:inline-block hidden me-3 h-10 w-px self-stretch bg-neutral-200 dark:bg-white"
              ></div>
              <!-- login -->
              <a
                href="login.html"
                id="headerAuthLink"
                data-header-auth-link
                class="mobile-auth bg-white dark:bg-transparent dark:text-white text-dark flex py-2 px-2 lg:py-2 lg:px-3 lg:border lg:border-gray-400 rounded-lg"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke-width="1.5"
                  stroke="currentColor"
                  class="lg:size-6 lg:me-2 size-5 md:size-6"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
                  />
                </svg>
                <span class="lg:inline-block hidden" data-header-auth-text>ورود / ثبت نام</span>
              </a>
            </div>
          </div>
        </div>
        <!-- mega menu -->
        <div
          id="megaMenu"
          class="desktop-mega-menu relative border-t border-gray-100 dark:border-white/20 mt-3 pt-2"
        >
          <div class="w-full">
            <nav class="flex items-center justify-center">

                    class="flex items-center font-bold hover:text-primary transition"
                    style="gap: .6rem;"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
                      viewBox="0 0 24 24"
                      stroke-width="1.5"

                    >
                      <path

                    دسته بندی

                  <div

                <li class="py-2">
                  <a

                    style="gap: .6rem;"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      fill="none"
