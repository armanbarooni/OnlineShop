<!doctype html>
<html lang="en" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>قالب فرشگاهیبالیگا</title>
    <meta name="description"
        content="قالب فرشگاهیبالیگا، بهترین قالب برای فروشگاه‌های اینترنتی با طراحی مدرن و واکنش‌گرا.">
    <meta name="keywords" content="قالب فروشگاهی, فروشگاه بالیگا, فروشگاه اینترنتی, طراحی واکنش‌گرا">
    <meta name="robots" content="index, follow">
    <meta name="author" content="آرینو">
    <meta name="copyright" content="تمامی حقوق متعلق بهبالیگا است.">

    <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/images/favicon_io/favicon-16x16.png">
    <link rel="canonical" href="https://example.com/your-page-url">
    <link rel="stylesheet" href="assets/js/plugin/swiper/swiper-bundle.min.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="preload" href="assets/fonts/payda/PeydaWebFaNum-Medium.woff2" as="font" type="font/woff2" crossorigin>
</head>

<body
    class="bg-light dark:bg-background-dark text-text-primary-light dark:text-text-primary-dark transition-colors duration-200">

    <div class="flex h-screen overflow-hidden max-w-[1920px] mx-auto">
        <div data-layout-partial="user-panel-sidebar" data-layout-script="assets/js/components/user-panel-nav.js"></div>

        <!-- main content -->
        <div class="flex flex-col flex-1 overflow-hidden">            <div data-layout-partial="user-panel-header"></div>

            <!-- page content -->
            <main class="flex-1 overflow-y-auto p-6 bg-gray-50 dark:bg-background-dark">
                <!-- Page header -->
                <div class="mb-6 flex flex-col md:flex-row md:items-center md:justify-between">
                    <div>
                        <h2 class="text-2xl font-bold text-dark dark:text-light">آدرس‌های من</h2>
                        <p class="text-gray-600 dark:text-gray-400">مدیریت آدرس‌های تحویل سفارش و صورتحساب</p>
                    </div>
                    <div class="mt-4 md:mt-0 flex flex-col sm:flex-row gap-3">
                        <button id="showAddressListButton" type="button"
                            class="hidden flex items-center justify-center px-4 py-2 text-sm font-medium rounded-lg border border-primary text-primary hover:bg-primary/10 dark:border-primary-dark dark:text-primary-400 transition-colors">
                            مشاهده لیست آدرس‌ها
                        </button>
                        <button onclick="AddressManager.openAddModal()"
                            class="flex items-center px-4 py-2 text-sm font-medium rounded-lg bg-primary text-white hover:bg-primary/90 dark:bg-primary-dark dark:hover:bg-primary/80 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 me-2" viewBox="0 0 20 20"
                                fill="currentColor">
                                <path fill-rule="evenodd"
                                    d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z"
                                    clip-rule="evenodd" />
                            </svg>
                            افزودن آدرس جدید
                        </button>
                    </div>
                </div>

                <section id="addressModal"
                    class="hidden mb-6 bg-white dark:bg-card-dark rounded-xl shadow-soft dark:shadow-soft-dark border border-gray-100 dark:border-gray-700">
                    <div class="p-6 border-b border-gray-200 dark:border-gray-700">
                        <h3 class="text-lg font-bold text-dark dark:text-light" id="modalTitle">افزودن آدرس جدید</h3>
                    </div>
                    <form class="p-6 space-y-4">
                        <div>
                            <label for="addressTitle" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">عنوان آدرس</label>
                            <input type="text" id="addressTitle"
                                class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                placeholder="مثال: منزل، محل کار">
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="province" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">استان</label>
                                <input type="text" id="province" inputmode="text" autocomplete="address-level1"
                                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                    placeholder="نام استان">
                            </div>
                            <div>
                                <label for="city" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">شهر</label>
                                <input type="text" id="city" inputmode="text" autocomplete="address-level2"
                                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                    placeholder="نام شهر">
                            </div>
                        </div>

                        <div>
                            <label for="address" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">آدرس دقیق</label>
                            <textarea id="address" rows="3"
                                class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                placeholder="خیابان، کوچه، پلاک، واحد"></textarea>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label for="postalCode" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">کد پستی <span class="text-xs text-gray-400">(اختیاری)</span></label>
                                <input type="text" id="postalCode" inputmode="numeric" maxlength="10" pattern="[0-9]*" autocomplete="postal-code"
                                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                    placeholder="کد پستی (اختیاری)">
                            </div>
                            <div>
                                <label for="phone" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">تلفن همراه</label>
                                <input type="tel" id="phone" inputmode="numeric" maxlength="11" pattern="[0-9]*" autocomplete="tel"
                                    class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                    placeholder="09xxxxxxxxx">
                            </div>
                        </div>

                        <div>
                            <label for="receiverName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">نام تحویل گیرنده</label>
                            <input type="text" id="receiverName"
                                class="w-full border rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                                placeholder="نام و نام خانوادگی">
                        </div>

                        <div class="flex items-center">
                            <input id="defaultAddress" type="checkbox"
                                class="form-checkbox h-5 w-5 text-primary dark:text-primary-dark rounded border-gray-300 dark:border-gray-600 focus:ring-primary dark:focus:ring-primary-dark">
                            <label for="defaultAddress" class="ms-2 block text-sm text-gray-700 dark:text-gray-300">
                                تنظیم به عنوان آدرس پیش‌فرض
                            </label>
                        </div>

                        <div class="flex flex-col sm:flex-row sm:justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-700">
                            <button type="button"
                                class="inline-flex justify-center rounded-lg border border-transparent shadow-sm px-4 py-2 bg-primary text-white text-sm font-medium hover:bg-primary/90 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:bg-primary-dark dark:hover:bg-primary/80">
                                ذخیره آدرس
                            </button>
                            <button onclick="AddressManager.closeModal()" type="button"
                                class="inline-flex justify-center rounded-lg border border-gray-300 shadow-sm px-4 py-2 bg-white text-sm font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary dark:bg-gray-700 dark:text-gray-300 dark:border-gray-600 dark:hover:bg-gray-600">
                                انصراف
                            </button>
                        </div>
                    </form>
                </section>

                <!-- List of addresses -->
                <div id="addressesContainer" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Addresses will be loaded here dynamically -->
                </div>
            </main>
        </div>
    </div>
    <!-- /end page divider -->
    <div data-layout-partial="user-panel-mobile-menu"></div>
<!-- Dependencies -->
    <script src="assets/js/components/layout-loader.js?v=20260604-1"></script>

    <script src="assets/js/dependencies/app.js?v=20260604-2"></script>
    <script src="assets/js/api-client.js"></script>
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/auth-service.js"></script>
    <script src="assets/js/auth-guard.js"></script>
    <script src="assets/js/services/address-service.js?v=20260604-2"></script>

    <!-- Page Script -->
    <script src="assets/js/pages/user-panel-address.js?v=20260604-7"></script>
</body>

</html>
